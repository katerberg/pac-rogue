<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Faint disc: opaque in the glow layer so bloom stays outside the coin. -->
  <path id="body" stroke="none" fill="currentColor" fill-opacity="0.22"
    d="M50 10 A40 40 0 1 0 50 90 A40 40 0 1 0 50 10 Z" />
  <!-- Outer rim. Path direction = future unspool order. -->
  <path id="rim" stroke="currentColor" fill="none" stroke-width="6.5" stroke-linecap="round"
    d="M50 10 A40 40 0 1 1 50 90 A40 40 0 1 1 50 10" />
  <!-- Minimal left-facing profile: brow ’ nose ’ chin ’ neck base. -->
  <path id="profile" stroke="currentColor" fill="none" stroke-width="6.5" stroke-linecap="round"
    d="M56 30 C48 24 40 28 37 36 C34 44 35 52 40 58 C44 63 50 66 54 68 L54 74" />
  <!-- Tiny queue hint on the right (Washington cue, abstract). -->
  <path id="queue" stroke="currentColor" fill="none" stroke-width="6.5" stroke-linecap="round"
    d="M58 38 C64 40 66 48 62 54" />
</svg>
