<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Faint filled silhouette (no stroke): keeps the glow outside the body, out of the pipe gaps. Mouth half-angle 70deg (resting open). -->
  <path id="body" stroke="none" fill="currentColor" fill-opacity="0.2"
    d="M50 50 L66.07 5.83 A47 47 0 1 0 66.07 94.17 Z" />
  <!-- One pipe folding on itself, radiant-heat style. Path direction = future unspool order:
       outer ring r44 from the upper lip round the back, U-bend in the lower lip,
       middle ring r28 back to the upper lip, U-bend, inner ring r12 to the lower lip. -->
  <path id="pipe" stroke="currentColor" fill="none" stroke-width="6.5" stroke-linecap="round"
    d="M65.05 8.65 A44 44 0 1 0 65.05 91.35 A8 8 0 0 0 59.58 76.31 A28 28 0 1 1 59.58 23.69 A8 8 0 0 1 54.10 38.72 A12 12 0 1 0 54.10 61.28" />
</svg>
