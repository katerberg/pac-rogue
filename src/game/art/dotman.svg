<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Faint filled silhouette (no stroke): keeps the glow outside the body, out of the pipe gaps. Mouth half-angle 48deg (resting open). -->
  <path id="body" stroke="none" fill="currentColor" fill-opacity="0.2"
    d="M50 50 L81.45 15.07 A47 47 0 1 0 81.45 84.93 Z" />
  <!-- One pipe folding on itself, radiant-heat style. Path direction = future unspool order:
       outer ring r44 from the upper lip round the back, U-bend in the lower lip,
       middle ring r28 back to the upper lip, U-bend, inner ring r12 to the lower lip. -->
  <path id="pipe" stroke="currentColor" fill="none" stroke-width="6.5" stroke-linecap="round"
    d="M79.44 17.30 A44 44 0 1 0 79.44 82.70 A8 8 0 0 0 68.74 70.81 A28 28 0 1 1 68.74 29.19 A8 8 0 0 1 58.03 41.08 A12 12 0 1 0 58.03 58.92" />
</svg>
