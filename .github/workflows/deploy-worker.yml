name: Worker deploy

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "src/domain/runLog.ts"
      - "src/domain/runUpload.ts"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate D1 and deploy the Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set in the production environment; skipping the Worker deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v5

      - name: Set up Node.js
        if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.check.outputs.enabled == 'true'
        run: npm ci

      - name: Apply D1 migrations
        if: steps.check.outputs.enabled == 'true'
        run: npx wrangler d1 migrations apply dot-man-api --remote --config worker/wrangler.toml

      - name: Deploy Worker
        if: steps.check.outputs.enabled == 'true'
        run: npx wrangler deploy --config worker/wrangler.toml
