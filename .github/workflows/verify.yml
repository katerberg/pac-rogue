name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run verify
        run: npm run verify

      - name: Upload visual smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: |
            artifacts/visual-smoke.png
            artifacts/visual-smoke-menu.png
          if-no-files-found: ignore

      - name: Publish visual smoke image for PR
        if: always() && github.event_name == 'pull_request'
        id: publish_smoke
        continue-on-error: true
        env:
          BRANCH: ci/visual-smoke/pr-${{ github.event.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ ! -f artifacts/visual-smoke.png ]; then
            echo "has_image=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          WORK=$(mktemp -d)
          cp artifacts/visual-smoke.png "$WORK/visual-smoke.png"
          if [ -f artifacts/visual-smoke-menu.png ]; then
            cp artifacts/visual-smoke-menu.png "$WORK/visual-smoke-menu.png"
          fi
          cd "$WORK"

          git init -q
          git checkout -q -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual-smoke.png
          if [ -f visual-smoke-menu.png ]; then
            git add visual-smoke-menu.png
          fi
          git commit -q -m "Visual smoke for PR #${{ github.event.number }} (run ${{ github.run_id }})"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -qf origin "HEAD:refs/heads/${BRANCH}"

          {
            echo "has_image=true"
            echo "image_url=https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH}/visual-smoke.png?run=${{ github.run_id }}"
            if [ -f visual-smoke-menu.png ]; then
              echo "menu_image_url=https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH}/visual-smoke-menu.png?run=${{ github.run_id }}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Prepare visual smoke PR comment
        if: always() && github.event_name == 'pull_request'
        id: smoke_comment
        run: |
          if [ ! -f artifacts/visual-smoke.png ]; then
            STATUS="screenshot missing"
          elif [ "${{ job.status }}" = "success" ]; then
            STATUS="passed"
          else
            STATUS="failed"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "body<<EOF"
            echo "## Visual smoke"
            echo
            echo "**Status:** ${STATUS}"
            echo
            if [ "${{ steps.publish_smoke.outputs.has_image }}" = "true" ]; then
              echo "### PlayScene"
              echo
              echo "![Visual smoke — play](${{ steps.publish_smoke.outputs.image_url }})"
              echo
              if [ -n "${{ steps.publish_smoke.outputs.menu_image_url }}" ]; then
                echo "### MenuScene"
                echo
                echo "![Visual smoke — menu](${{ steps.publish_smoke.outputs.menu_image_url }})"
                echo
              fi
            fi
            echo "- [Workflow run](${RUN_URL})"
            echo "- Screenshots also available as the \`visual-smoke\` workflow artifact."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment visual smoke on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: visual-smoke
          message: ${{ steps.smoke_comment.outputs.body }}
