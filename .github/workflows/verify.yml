name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: npm run verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run verify
        run: npm run verify

      - name: Upload visual smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-smoke
          path: artifacts/visual-smoke.png
          if-no-files-found: ignore

      - name: Prepare visual smoke PR comment
        if: always() && github.event_name == 'pull_request'
        id: smoke_comment
        run: |
          if [ ! -f artifacts/visual-smoke.png ]; then
            STATUS="screenshot missing"
          elif [ "${{ job.status }}" = "success" ]; then
            STATUS="passed"
          else
            STATUS="failed"
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "body<<EOF"
            echo "## Visual smoke"
            echo
            echo "**Status:** ${STATUS}"
            echo
            echo "- [Workflow run](${RUN_URL})"
            echo "- Download the \`visual-smoke\` artifact from that run for \`artifacts/visual-smoke.png\` (when present)."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment visual smoke link on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: visual-smoke
          message: ${{ steps.smoke_comment.outputs.body }}
